<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Telemetry Vector | Fintech.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0f; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-[#12121a] border border-slate-800 rounded-2xl p-8 space-y-6 shadow-2xl shadow-purple-950/10">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Add Ledger Telemetry</h1>
            <p class="text-slate-500 text-sm mt-1">Deploy a new operational data vector to your personal profile matrix.</p>
        </div>

        <form action="{% url 'tracker:add_transaction' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Title</label>
                <input type="text" name="title" required placeholder="e.g. Server Infrastructure Allocation" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition placeholder-slate-700">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Amount ($)</label>
                    <input type="number" step="0.01" name="amount" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition placeholder-slate-700">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Vector Type</label>
                    <select name="transaction_type" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Execution Date</label>
                <input type="date" name="date" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition text-slate-400">
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'tracker:index' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl text-sm font-medium transition">
                    Abort
                </a>
                <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-6 py-3 rounded-xl text-sm tracking-wide transition shadow-lg shadow-purple-950/40">
                    Commit Entry
                </button>
            </div>
        </form>
    </div>

</body>
</html>
