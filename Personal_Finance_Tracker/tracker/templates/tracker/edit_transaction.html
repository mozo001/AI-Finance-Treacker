<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutate Telemetry | Fintech.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0f; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-[#12121a] border border-slate-800 rounded-2xl p-8 space-y-6 shadow-2xl shadow-purple-950/10">
        
        <div>
            <span class="text-xs font-mono text-purple-400 bg-purple-500/10 px-2.5 py-1 rounded-md">ID: #{{ transaction.pk }}</span>
            <h1 class="text-2xl font-bold text-white tracking-tight mt-2">Modify Ledger Payload</h1>
            <p class="text-slate-500 text-sm mt-1">Alter parameters of an existing data sequence inside the core database.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Title</label>
                <input type="text" name="title" value="{{ transaction.title }}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Amount ($)</label>
                    <input type="number" step="0.01" name="amount" value="{{ transaction.amount|stringformat:'.2f' }}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Vector Type</label>
                    <select name="transaction_type" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                        <option value="expense" {% if transaction.transaction_type == 'expense' %}selected{% endif %}>Expense</option>
                        <option value="income" {% if transaction.transaction_type == 'income' %}selected{% endif %}>Income</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Category Node</label>
                    <input type="text" name="category" value="{{ transaction.category }}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Execution Date</label>
                    <input type="date" name="date" value="{{ transaction.date|date:'Y-m-d' }}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition text-slate-300">
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Payload Description</label>
                <textarea name="description" rows="3" placeholder="Enter telemetry notes..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition resize-none placeholder-slate-700">{{ transaction.description }}</textarea>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3">
                <a href="{% url 'tracker:transaction' %}" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-3 rounded-xl text-sm font-medium transition">
                    Cancel
                </a>
                <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-medium px-6 py-3 rounded-xl text-sm tracking-wide transition shadow-lg shadow-purple-950/40">
                    Update Vector
                </button>
            </div>
        </form>
    </div>

</body>
</html>
