<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Access | Fintech.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0f; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#12121a] border border-slate-800 rounded-2xl p-8 space-y-6 shadow-2xl shadow-purple-950/10">
        <div class="text-center">
            <div class="inline-flex h-12 w-12 bg-purple-600 rounded-xl items-center justify-center font-bold text-white text-xl mb-4 shadow-lg shadow-purple-600/20">
                𝚽
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Access Console</h1>
            <p class="text-slate-500 text-sm mt-1">Provide credentials to mount personal ledger vectors.</p>
        </div>

        <form method="POST" action="{% url 'tracker:login' %}" class="space-y-4">
            {% csrf_token %}

            {% if error %}
            <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs px-4 py-3 rounded-xl">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Username</label>
                <input type="text" name="username" required placeholder="Enter entry identity" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs text-slate-400 uppercase font-bold tracking-wider mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition placeholder-slate-600">
            </div>

            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-xl text-sm tracking-wide transition shadow-lg shadow-purple-950/40 pt-4">
                Authenticate Session
            </button>
        </form>

        <div class="border-t border-slate-800/60 pt-4 text-center">
            <p class="text-sm text-slate-500">
                New user profile? 
                <a href="{% url 'tracker:signup' %}" class="text-purple-400 hover:underline font-medium">Register account</a>
            </p>
        </div>
    </div>
</body>
</html>
